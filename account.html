<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Account — Steady Focus Tutoring</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site">
  <div class="nav">
    <a href="index.html" class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" stroke="#223662" stroke-width="5" fill="none"/><circle cx="20" cy="20" r="16" stroke="#f2a93b" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="35" transform="rotate(-90 20 20)"/></svg>
      <span class="brand-name">Steady Focus<span>Tutoring</span></span>
    </a>
    <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false"><span class="bar"></span><span class="bar"></span><span class="bar"></span></button>
    <nav class="links">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="blog.html">Blog</a>
      <a href="forum.html">Forum</a>
      <a href="chatbot.html">Tutor Bot</a>
      <a href="portal.html">Course Portal</a>
      <a href="contact.html">Contact</a>
      <a href="account.html" class="active">My Account</a>
    </nav>
  </div>
</header>

<section class="hero" style="padding-bottom:10px;">
  <div class="container" style="max-width:480px;">
    <div class="eyebrow">Course portal access</div>
    <h1 style="font-size:2rem;">My Account</h1>
  </div>
</section>

<section style="padding-top:10px;">
  <div class="container" style="max-width:480px;">

    <div id="checkout-banner" class="badge-note" style="display:none; margin-bottom:20px;"></div>

    <div id="loading-state" class="badge-note">Checking your account…</div>

    <div id="logged-out-state" style="display:none;">
      <div class="pill-row">
        <button class="pill active" id="tab-login">Log in</button>
        <button class="pill" id="tab-signup">Sign up</button>
      </div>

      <div class="card" id="login-card">
        <form id="login-form">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required autocomplete="email">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required autocomplete="current-password">
          <button type="submit" class="btn btn-primary" style="width:100%;">Log in</button>
        </form>
        <p id="login-error" class="field-note" style="display:none; color:var(--danger); margin-top:12px;"></p>
      </div>

      <div class="card" id="signup-card" style="display:none;">
        <form id="signup-form">
          <label for="signup-email">Email</label>
          <input type="email" id="signup-email" required autocomplete="email">
          <label for="signup-password">Password</label>
          <input type="password" id="signup-password" required autocomplete="new-password" minlength="8">
          <p class="field-note">At least 8 characters.</p>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create account</button>
        </form>
        <p id="signup-error" class="field-note" style="display:none; color:var(--danger); margin-top:12px;"></p>
      </div>
    </div>

    <div id="logged-in-state" style="display:none;">
      <div class="card">
        <span class="tag" id="status-tag">Status</span>
        <h3 id="account-email"></h3>
        <p id="account-status-desc"></p>
        <div style="display:flex; gap:12px; flex-wrap:wrap;">
          <button id="subscribe-btn" class="btn btn-primary">Subscribe now</button>
          <button id="billing-btn" class="btn btn-ghost" style="display:none;">Manage billing</button>
          <button id="logout-btn" class="btn btn-ghost">Log out</button>
        </div>
        <p id="account-action-error" class="field-note" style="display:none; color:var(--danger); margin-top:12px;"></p>
      </div>
    </div>

  </div>
</section>

<footer class="site">
  <div class="container foot-grid">
    <div class="brand-name">Steady Focus Tutoring</div>
    <div class="foot-links">
      <a href="portal.html">Course Portal</a>
      <a href="index.html">Back to site</a>
    </div>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/config.js"></script>
<script src="js/account.js"></script>
</body>
</html>
